name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ba1!pruebas-${{ github.run_id }}
        ports:
          - 1433:1433
    env:
      BA_SQL_SERVER: localhost,1433
      BA_SQL_DRIVER: ODBC Driver 18 for SQL Server
      BA_SQL_AUTH: sql
      BA_SQL_USER: sa
      BA_SQL_PASSWORD: Ba1!pruebas-${{ github.run_id }}
      BA_SQL_CONFIAR_CERTIFICADO: si
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - run: ruff check src tests
      - run: pytest
